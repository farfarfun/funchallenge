[project]
name = "funchallenge"
version = "0.0.2"
description = "dark_challenge_2048 数据库查询封装：基于 SQLAlchemy 的 2048 主题挑战数据读取工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "sqlalchemy>=2.0",
    "funsecret>=1.4.84",
    "pymysql>=1.1",
    "farlog>=1.1.7",
]

[[project.authors]]
name = "牛哥"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funchallenge"
Releases = "https://github.com/farfarfun/funchallenge/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funchallenge"]

[dependency-groups]
dev = ["pytest>=7.0"]
